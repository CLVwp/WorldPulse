<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldPulse — L'actualité mondiale en temps réel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fond radar -->
  <div id="radar-bg"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>WORLD<span>PULSE</span></h1>
      <span class="tagline">flux mondial géolocalisé</span>
    </div>
    <div class="status-group">
      <div class="status">
        <span class="pulse-ring"></span>
        <span id="status-conn" class="status-text">connexion…</span>
      </div>
      <div class="status">
        <span class="label">events</span>
        <span id="event-count">0</span>
      </div>
      <div class="status">
        <span class="label">dernier scan</span>
        <span id="last-scan">—</span>
      </div>
      <button id="rescan-btn" title="Relancer un scan des sources">
        <span id="rescan-icon">⟳</span>
        <span id="rescan-label">SCAN</span>
      </button>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <!-- Ticker des derniers events -->
    <aside id="feed">
      <div class="feed-head">
        <h2>FLUX</h2>
        <span class="feed-hint">cliquer pour zoomer</span>
      </div>
      <ul id="feed-list"></ul>
    </aside>

    <!-- Popup détail d'un event -->
    <div id="detail" class="hidden">
      <button id="detail-close" aria-label="Fermer">×</button>
      <div class="detail-meta">
        <span id="detail-country" class="detail-country"></span>
        <span id="detail-source" class="detail-source"></span>
      </div>
      <h3 id="detail-title"></h3>
      <p id="detail-desc"></p>
      <a id="detail-link" href="#" target="_blank" rel="noopener">Lire l'article →</a>
    </div>

    <!-- Légende intensité -->
    <div id="legend">
      <span class="legend-title">INTENSITÉ</span>
      <div class="legend-scale">
        <span class="lv lv1"></span><span class="lv lv2"></span><span class="lv lv3"></span>
      </div>
      <div class="legend-labels">
        <span>faible</span><span>moyen</span><span>fort</span>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
